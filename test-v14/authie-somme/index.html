<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6fa8">
<title>SPOT V18 · Saint-Jacut, Authie & Somme</title>
<style>
:root{
  --bg:#f5f6f7;--card:#fff;--text:#18202a;--muted:#65717c;
  --border:#d5dadd;--accent:#337abd;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#15181b;--card:#202428;--text:#f2f4f6;--muted:#acb5bd;
        --border:#3c4148;--accent:#5b9bd5;}
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}

header{
  position:sticky;top:0;flex:none;padding:12px 14px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
  box-shadow:0 2px 10px rgba(0,0,0,.05);z-index:10
}
@media (prefers-color-scheme:dark){
  header{background:rgba(32,36,40,.92)}
}

.headerbar{display:flex;flex-direction:column;align-items:center;gap:10px}
.app-title{
  margin:0;
  font-size:31px;
  font-weight:900;
  line-height:1.02;
  letter-spacing:.04em;
  text-transform:uppercase;
  text-align:center;
}
.brandline{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}
.byline{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-width:0;
}
.byline-prefix{font-size:14px;color:var(--muted);font-weight:700;flex:none}
.byline-logo{
  width:32px;height:32px;border-radius:10px;padding:4px;
  background:rgba(255,255,255,.78);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;flex:none
}
.byline-logo img{max-width:100%;max-height:100%;display:block}
.byline-wordmark{height:48px;width:auto;max-width:680px;display:block;margin-left:-8px}
.toplinks{display:flex;align-items:center;gap:8px}
.toplink{
  width:42px;height:42px;border-radius:12px;border:1px solid var(--border);
  background:rgba(255,255,255,.82);display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.05);text-decoration:none;overflow:hidden
}
.toplink img{width:24px;height:24px;object-fit:contain;display:block}
.toplink.website img{width:26px;height:26px}
.toplink:focus-visible,.zone:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zones{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.zone{
  appearance:none;border:1px solid var(--border);background:var(--card);color:var(--text);
  border-radius:999px;padding:8px 12px;font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  cursor:pointer;white-space:nowrap
}
.zone.active{background:var(--accent);border-color:var(--accent);color:#fff}

iframe{display:block;flex:1 1 auto;width:100%;min-height:0;border:0;background:var(--bg)}

@media(max-width:700px){
  header{padding:10px}
  .headerbar{gap:8px}
  .app-title{font-size:23px;letter-spacing:.03em}
  .brandline{gap:10px}
  .byline{gap:6px}
  .byline-prefix{font-size:12px}
  .byline-logo{width:26px;height:26px;border-radius:8px;padding:3px}
  .byline-wordmark{height:36px;max-width:460px;margin-left:-6px}
  .toplink{width:38px;height:38px;border-radius:10px}
  .toplink img{width:22px;height:22px}
  .zones{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
  .zone{padding:9px 5px;font-size:12px;overflow:hidden;text-overflow:ellipsis}
}
</style>
</head>
<body>

<header>
  <div class="headerbar">
    <h1 class="app-title">MARÉES &amp; PROFONDEUR</h1>

    <div class="brandline" aria-label="Signature TNT Kiteboards et liens">
      <div class="byline">
        <span class="byline-prefix">par</span>
        <span class="byline-logo"><img src="assets/tnt-picto.png" alt="TNT"></span>
        <img class="byline-wordmark" src="assets/tnt-wordmark-v3.jpg" alt="TNT KITEBOARDS">
      </div>
      <div class="toplinks" aria-label="Liens TNT Kiteboards">
        <a class="toplink instagram" href="https://www.instagram.com/tnt_kiteboards" target="_blank" rel="noopener noreferrer" aria-label="Instagram TNT Kiteboards" title="Instagram TNT Kiteboards">
          <img src="assets/instagram.png" alt="Instagram">
        </a>
        <a class="toplink website" href="https://www.tntkiteboards.com/board" target="_blank" rel="noopener noreferrer" aria-label="Site internet TNT Kiteboards" title="Site internet TNT Kiteboards">
          <img src="assets/website.jpg" alt="Site internet">
        </a>
      </div>
    </div>

    <nav class="zones" aria-label="Choix de la zone">
      <button class="zone active" type="button" data-zone="st-jacut">Saint-Jacut</button>
      <button class="zone" type="button" data-zone="authie">Baie d’Authie</button>
      <button class="zone" type="button" data-zone="somme">Baie de Somme</button>
    </nav>
  </div>
</header>

<iframe id="viewer" title="Carte de marée et profondeur" src="st-jacut/index.html"></iframe>

<script>
const viewer=document.getElementById('viewer');
const buttons=[...document.querySelectorAll('.zone')];
const sources={
  'st-jacut':'st-jacut/index.html',
  'authie':'authie-somme/index.html?zone=authie',
  'somme':'authie-somme/index.html?zone=somme'
};

function openZone(zone,updateHash=true){
  if(!sources[zone])zone='st-jacut';
  buttons.forEach(b=>b.classList.toggle('active',b.dataset.zone===zone));
  viewer.src=sources[zone];
  if(updateHash)history.replaceState(null,'','#'+zone);
}

buttons.forEach(b=>b.addEventListener('click',()=>openZone(b.dataset.zone)));
const initial=(location.hash||'').replace('#','');
openZone(sources[initial]?initial:'st-jacut',false);
</script>
</body>
</html>
